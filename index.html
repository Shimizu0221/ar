<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
</head>
<body>
<a-scene physics="gravity: -9.8; debug: false">
    <a-sky color="skyblue" material="src:#sand"></a-sky>
    
    <a-plane rotation="-90 0 0" width="30" height="30" material="src:#wood" static-body></a-plane>

    <a-box class="jenga" position="-0.3 0.1 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.0 0.1 0" color="blue" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.3 0.1 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>

    <a-box class="jenga" position=" 0 0.3 -0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 0.3 0.0" color="orange" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 0.3 0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>

    <a-box class="jenga" position="-0.3 0.5 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.0 0.5 0" color="blue" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.3 0.5 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>

    <a-box class="jenga" position=" 0 0.7 -0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 0.7 0.0" color="orange" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 0.7 0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>

    <a-box class="jenga" position="-0.3 0.9 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.0 0.9 0" color="blue" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.3 0.9 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>

    <a-box class="jenga" position=" 0 1.1 -0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 1.1  0.0" color="orange" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 1.1  0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>

    <a-box class="jenga" position="-0.3 1.3 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.0 1.3 0" color="blue" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.3 1.3 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>

    <a-box class="jenga" position=" 0 1.5 -0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 1.5  0.0" color="orange" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 1.5  0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>

    <a-box class="jenga" position="-0.3 1.7 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.0 1.7 0" color="blue" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.3 1.7 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>

    <a-box class="jenga" position=" 0 1.9 -0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 1.9  0.0" color="orange" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 1.9  0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>

    <a-box class="jenga" position="-0.3 2.1 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.0 2.1 0" color="blue" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.3 2.1 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>

    <a-box class="jenga" position=" 0 2.3 -0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 2.3  0.0" color="orange" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
    <a-box class="jenga" position=" 0 2.3  0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>

    <a-box class="jenga" position="-0.3 2.5 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.0 2.5 0" color="blue" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>
    <a-box class="jenga" position=" 0.3 2.5 0" color="red" width="0.3" height="0.2" depth="0.9" dynamic-body></a-box>

    //読み込んだときにブロックが崩れないようにするために板を配置しました
    <a-box color="lightgreen" position="0.7 1 0" width="2" height="3.4" depth="0.2" rotation="0 90 0" static-body></a-box>
    <a-box color="lightgreen" position="-0.6 1 0" width="2" height="3.4" depth="0.2" rotation="0 90 0" static-body></a-box>


    <a-camera position="0 2.5 5.0">
        <a-cursor></a-cursor>
    </a-camera>

    <a-assets>
        <img id="wood" src="../assets/images/wood.jpg" alt="">
        <img id="wall" src="../assets/images/Wallpaper.jpg" alt="">
        <img id="sand" src="../assets/images/Sand.jpg" alt="">
    </a-assets>
</a-scene>

<script>
    //ここではAIを使ってジェンガの挙動がおかしくならないようにしました
    document.querySelectorAll('.jenga').forEach(box => {
        box.addEventListener('click', () => {
           
            box.removeAttribute('dynamic-body');

            box.setAttribute('material', 'opacity: 0; transparent: true;');

            box.classList.remove('jenga');
            setTimeout(() => {
                box.parentNode.removeChild(box);
            }, 1000);
        });
    });
</script>
</body>
</html>
